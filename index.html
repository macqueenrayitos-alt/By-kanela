<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f8f5f2;
    color: #39302d;
    font-family: Arial, sans-serif;
}

/* ENCABEZADO */

header {
    background: #e9ddd5;
    text-align: center;
    padding: 45px 20px;
}

header h1 {
    font-family: Georgia, serif;
    font-size: 35px;
    font-weight: normal;
    letter-spacing: 5px;
}

header p {
    margin-top: 12px;
    letter-spacing: 3px;
    font-size: 12px;
}

/* TITULO DEL CATALOGO */

.catalogo {
    max-width: 1400px;
    margin: auto;
    padding: 35px 20px;
}

.titulo {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 27px;
    font-weight: normal;
    margin-bottom: 35px;
}

/* PRODUCTOS */

.productos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
}

.producto {
    background: white;
    padding: 12px;
    border-radius: 4px;
}

/* IMAGENES */

.fotos {
    position: relative;
    width: 100%;
    background: #f8f5f2;
    overflow: hidden;
}

.fotos img {
    width: 100%;
    height: auto;
    max-height: 450px;
    object-fit: contain;
    display: block;
    cursor: zoom-in;
}

/* FLECHAS */

.flecha {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: rgba(255,255,255,0.9);
    color: #39302d;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
}

.izquierda {
    left: 8px;
}

.derecha {
    right: 8px;
}

.contador {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
}

/* INFORMACION DEL PRODUCTO */

.nombre {
    font-size: 16px;
    font-weight: normal;
    margin-top: 15px;
}

.descripcion {
    font-size: 13px;
    color: #766a64;
    line-height: 1.6;
    margin-top: 10px;
}

.precio {
    font-weight: bold;
    margin-top: 12px;
    color: #806052;
    font-size: 15px;
}

.precio-mayor {
    font-weight: bold;
    margin-top: 7px;
    color: #806052;
    font-size: 15px;
}

.referencia {
    color: #999;
    font-size: 12px;
    margin-top: 8px;
}

/* PIE DE PAGINA */

footer {
    text-align: center;
    background: #e9ddd5;
    padding: 35px 20px;
    margin-top: 40px;
}

footer h3 {
    font-family: Georgia, serif;
    letter-spacing: 3px;
    font-weight: normal;
}

footer p {
    margin-top: 10px;
    font-size: 13px;
}

/* COMPUTADORES Y TABLETS */

@media (max-width: 1000px) {
    .productos {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* CELULARES */

@media (max-width: 600px) {
    .productos {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .producto {
        padding: 8px;
    }

    header h1 {
        font-size: 25px;
        letter-spacing: 3px;
    }

    .nombre {
        font-size: 14px;
    }

    .descripcion {
        font-size: 12px;
    }

    .precio,
    .precio-mayor {
        font-size: 13px;
    }

    .fotos img {
        max-height: 350px;
    }

    .flecha {
        width: 32px;
        height: 32px;
    }
}
</style>
</head>

// ============================================
// CREAR LOS 55 PRODUCTOS AUTOMATICAMENTE
// ============================================

const contenedor = document.getElementById("productos");

for (let i = 0; i < 55; i++) {

    // Si existe el producto, usa sus datos.
    // Si no existe, crea uno automáticamente.
    const producto = productos[i] || {
        nombre: "Producto " + String(i + 1).padStart(2, "0"),
        descripcion: "Producto próximamente disponible.",
        precioUnidad: 0,
        precioMayor: 0,
        imagenes: []
    };

    // Filtrar enlaces válidos
    const fotosValidas = (producto.imagenes || []).filter(
        foto => foto &&
        !foto.startsWith("LINK_") &&
        foto.startsWith("http")
    );

    // Imagen para los productos que todavía no tienen foto
    const fotos = fotosValidas.length > 0
        ? fotosValidas
        : [
            "https://placehold.co/600x800/f1e7e1/8b7468?text=By+Kanela+Sotto"
        ];

    let indice = 0;

    // Crear tarjeta
    const tarjeta = document.createElement("div");
    tarjeta.className = "producto";

    tarjeta.innerHTML = `
        <div class="fotos">

            <img
                class="foto-producto"
                src="${fotos[0]}"
                alt="${producto.nombre}"
                loading="lazy"
            >

            ${fotos.length > 1 ? `
                <button class="flecha izquierda"
                    aria-label="Foto anterior">‹</button>

                <button class="flecha derecha"
                    aria-label="Foto siguiente">›</button>

                <div class="contador">
                    1 / ${fotos.length}
                </div>
            ` : ""}

        </div>

        <h3 class="nombre">${producto.nombre}</h3>

        <p class="descripcion">
            ${producto.descripcion || ""}
        </p>

        <p class="precio">
            Precio por unidad:
            ${
                producto.precioUnidad > 0
                ? "$" + producto.precioUnidad.toLocaleString("es-CO") + " COP"
                : "Por agregar"
            }
        </p>

        <p class="precio-mayor">
            Precio por mayor:
            ${
                producto.precioMayor > 0
                ? "$" + producto.precioMayor.toLocaleString("es-CO") + " COP"
                : "Por agregar"
            }
        </p>

        <p class="referencia">
            Ref. KS${String(i + 1).padStart(2, "0")}
        </p>
    `;

    // Abrir imagen grande
    const imagen = tarjeta.querySelector(".foto-producto");

    imagen.addEventListener("click", () => {
        window.open(fotos[indice], "_blank");
    });

    // Botones para cambiar fotos
    if (fotos.length > 1) {

        const contador = tarjeta.querySelector(".contador");
        const botonDerecha = tarjeta.querySelector(".derecha");
        const botonIzquierda = tarjeta.querySelector(".izquierda");

        botonDerecha.addEventListener("click", () => {

            indice = (indice + 1) % fotos.length;
            imagen.src = fotos[indice];

            contador.textContent =
                `${indice + 1} / ${fotos.length}`;
        });

        botonIzquierda.addEventListener("click", () => {

            indice = (indice - 1 + fotos.length) % fotos.length;
            imagen.src = fotos[indice];

            contador.textContent =
                `${indice + 1} / ${fotos.length}`;
        });
    }

    // Agregar tarjeta a la página
    contenedor.appendChild(tarjeta);
}
</script>
